# Overrides for the synthetic smoke test (pipeline check only; numbers are meaningless).
project:
  smoke_test: true
panels:
  assets:
    start: "2000-01-01"
    dev_end: "2009-12-31"
    end: "2013-12-31"
    first_forecast_year: 2004
    horizons: [21, 5]
  ff_us:
    start: "1990-01-01"
    dev_end: "2004-12-31"
    end: "2012-12-31"
    first_forecast_year: 1995
    refit_every_years: 3
  ff_intl:
    start: "1995-01-01"
    dev_end: "2006-12-31"
    end: "2012-12-31"
    first_forecast_year: 1999
    refit_every_years: 3
forecast:
  train_stride: {21: 10, 5: 6, 1: 4}
  dlinear:
    weight_decay_grid: [1.0e-1]
    kernel_grid: [25]
    max_epochs: 3
    patience: 1
    seeds: 1
  lstm: {window: 5, hidden: 8, layers: 1, epochs: 1, seeds: 1}
  garch: {enabled: true, fit_window: 750, max_log_ratio: 1.609}
conformal:
  levels: [0.80, 0.90]
  gamma_grid: [0.01, 0.05]
vm:
  cvm_levels: [0.7, 0.9]
evaluation:
  bootstrap_reps: 200
  mcs_reps: 200
